<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Cassette Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --shell: #f26a0c;       /* cassette body */
    --shell-dark: #c8540a;
    --band: #15222d;        /* centre band */
    --label: #fbfaf6;       /* paper label */
    --ink: #15222d;
    --window: #f7e3cf;
    --reel: #fbfaf6;
    --tape: #3a2a22;
    --accent: #f26a0c;
    --deck: #fbfaf6;
    --deck-ink: #15222d;
    --page: transparent;
  }
  :root[data-theme="autumn"] {
    --shell: #c96f32; --shell-dark: #9a4f1f; --band: #8c3a1d; --label: #f7efe2; --ink: #2a1c14;
    --window: #f6dcc5; --reel: #f7efe2; --tape: #4a2c1c; --accent: #c96f32; --deck: #f7e6d4; --deck-ink: #2a1c14;
  }
  :root[data-theme="mint"] {
    --shell: #7cc6b0; --shell-dark: #4f9c87; --band: #1f3b3a; --label: #f6fbf8; --ink: #1f3b3a;
    --window: #dff1ea; --reel: #f6fbf8; --tape: #2c3a36; --accent: #2f8a72; --deck: #eef8f4; --deck-ink: #1f3b3a;
  }
  :root[data-theme="night"] {
    --shell: #1d2b38; --shell-dark: #101a23; --band: #f26a0c; --label: #fbfaf6; --ink: #15222d;
    --window: #26394a; --reel: #fbfaf6; --tape: #0c1218; --accent: #f26a0c; --deck: #1d2b38; --deck-ink: #fbfaf6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); font-family: "Space Grotesk", system-ui, sans-serif; color: var(--deck-ink); }
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .wrap { width: min(520px, 100%); position: relative; }

  /* ---------------- cassette */
  .cassette { position: relative; z-index: 2; filter: drop-shadow(0 14px 22px rgba(21, 34, 45, .22)); }
  .cassette svg { display: block; width: 100%; height: auto; }
  .reel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; animation-play-state: paused; }
  .reel.right { animation-duration: 2.4s; }
  .playing .reel { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title {
    position: absolute; left: 12%; right: 12%; top: 8.5%; height: 13%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Caveat", cursive; font-size: clamp(20px, 6.4vw, 34px); color: var(--ink);
    outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text;
  }
  .title:focus { background: rgba(0, 0, 0, .04); border-radius: 6px; }
  .now {
    position: absolute; left: 7%; right: 7%; bottom: 14.5%;
    display: flex; justify-content: space-between; gap: 12px;
    font-size: clamp(10px, 2.6vw, 13px); font-weight: 700; letter-spacing: .02em; color: var(--label);
  }
  .now .track { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; opacity: .95; }
  .now .time { flex: none; font-variant-numeric: tabular-nums; }
  .progress { position: absolute; left: 7%; right: 7%; bottom: 7.5%; height: 8px; cursor: pointer; }
  .progress .bar { position: absolute; inset: 0; border-radius: 99px; background: rgba(0, 0, 0, .18); overflow: hidden; }
  .progress .fill { height: 100%; width: 0; background: var(--label); border-radius: 99px; }

  /* ---------------- deck controls */
  .deck {
    margin: -18px 4% 0; padding: 30px 18px 16px; border-radius: 0 0 18px 18px;
    background: var(--deck); box-shadow: 0 10px 24px rgba(21, 34, 45, .12);
    display: flex; align-items: center; gap: 10px; position: relative; z-index: 1;
  }
  .btn {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; background: var(--label); color: var(--deck-ink);
    box-shadow: 0 2px 0 rgba(0, 0, 0, .15), inset 0 0 0 2px rgba(21, 34, 45, .12);
    transition: transform .08s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0, 0, 0, .15), inset 0 0 0 2px rgba(21, 34, 45, .12); }
  .btn.play { width: 52px; height: 52px; background: var(--accent); color: #fff; }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .btn.small { width: 34px; height: 34px; }
  .btn.small svg { width: 15px; height: 15px; }
  .btn.on { background: var(--deck-ink); color: var(--deck); }
  .vol { flex: 1; min-width: 50px; accent-color: var(--accent); }

  /* ---------------- link loader */
  .loader { display: flex; gap: 8px; margin: 12px 4% 0; }
  .loader input {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 2px solid rgba(21, 34, 45, .15);
    font: inherit; font-size: 13px; background: var(--deck); color: var(--deck-ink); outline: none;
  }
  .loader input:focus { border-color: var(--accent); }
  .loader button {
    border: 0; border-radius: 10px; padding: 0 14px; font: inherit; font-weight: 700; font-size: 13px;
    background: var(--deck-ink); color: var(--deck); cursor: pointer;
  }
  .msg { margin: 8px 4% 0; font-size: 12px; min-height: 16px; opacity: .8; }
  .msg.err { color: #d1381c; opacity: 1; }
  .hide-ui .loader { display: none; }

  /* YouTube player: kept >=200x200 (API requirement) but invisible unless "video" is toggled on */
  .yt { position: absolute; left: 50%; top: 8px; width: 240px; height: 200px; transform: translateX(-50%);
        opacity: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .show-video .yt { position: relative; left: auto; top: auto; transform: none; width: 92%; height: auto;
                    aspect-ratio: 16/9; margin: 12px 4% 0; opacity: 1; pointer-events: auto; border-radius: 12px; }
  .yt iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="cassette" id="cassette">
    <svg viewBox="0 0 520 330" aria-hidden="true">
      <!-- body -->
      <rect x="4" y="4" width="512" height="322" rx="22" fill="var(--shell)" stroke="var(--shell-dark)" stroke-width="3"/>
      <circle cx="22" cy="22" r="6" fill="var(--ink)" opacity=".8"/><circle cx="498" cy="22" r="6" fill="var(--ink)" opacity=".8"/>
      <circle cx="22" cy="214" r="6" fill="var(--ink)" opacity=".8"/><circle cx="498" cy="214" r="6" fill="var(--ink)" opacity=".8"/>
      <!-- label -->
      <rect x="22" y="20" width="476" height="206" rx="12" fill="var(--label)"/>
      <line x1="40" y1="70" x2="480" y2="70" stroke="var(--ink)" stroke-opacity=".15" stroke-width="2"/>
      <rect x="22" y="84" width="476" height="142" rx="0" fill="var(--band)"/>
      <rect x="22" y="214" width="476" height="12" fill="var(--band)"/>
      <!-- side letter & length -->
      <rect x="38" y="138" width="34" height="34" rx="6" fill="none" stroke="var(--shell)" stroke-width="3"/>
      <text id="sideTxt" x="55" y="163" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="20" fill="var(--shell)">A</text>
      <text x="466" y="163" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="24" fill="var(--shell)">60</text>
      <!-- tape window -->
      <rect x="96" y="104" width="328" height="102" rx="50" fill="var(--window)"/>
      <!-- tape packs (radius driven by progress) -->
      <circle id="packL" cx="168" cy="155" r="44" fill="var(--tape)"/>
      <circle id="packR" cx="352" cy="155" r="22" fill="var(--tape)"/>
      <!-- centre viewport -->
      <rect x="208" y="128" width="104" height="54" rx="8" fill="var(--ink)"/>
      <rect x="226" y="141" width="68" height="28" rx="3" fill="#b9b39a"/>
      <circle cx="216" cy="155" r="4" fill="#3a4a58"/><circle cx="304" cy="155" r="4" fill="#3a4a58"/>
      <!-- reels -->
      <g class="reel left">
        <circle cx="168" cy="155" r="24" fill="var(--reel)" stroke="#d9cdbd" stroke-width="3"/>
        <g fill="#e9a77b">
          <rect x="165" y="134" width="6" height="16" rx="2"/><rect x="165" y="160" width="6" height="16" rx="2"/>
          <rect x="147" y="152" width="16" height="6" rx="2"/><rect x="173" y="152" width="16" height="6" rx="2"/>
          <rect x="165" y="134" width="6" height="16" rx="2" transform="rotate(45 168 155)"/>
          <rect x="165" y="160" width="6" height="16" rx="2" transform="rotate(45 168 155)"/>
          <rect x="147" y="152" width="16" height="6" rx="2" transform="rotate(45 168 155)"/>
          <rect x="173" y="152" width="16" height="6" rx="2" transform="rotate(45 168 155)"/>
        </g>
        <circle cx="168" cy="155" r="6" fill="var(--reel)"/>
      </g>
      <g class="reel right">
        <circle cx="352" cy="155" r="24" fill="var(--reel)" stroke="#d9cdbd" stroke-width="3"/>
        <g fill="#e9a77b">
          <rect x="349" y="134" width="6" height="16" rx="2"/><rect x="349" y="160" width="6" height="16" rx="2"/>
          <rect x="331" y="152" width="16" height="6" rx="2"/><rect x="357" y="152" width="16" height="6" rx="2"/>
          <rect x="349" y="134" width="6" height="16" rx="2" transform="rotate(45 352 155)"/>
          <rect x="349" y="160" width="6" height="16" rx="2" transform="rotate(45 352 155)"/>
          <rect x="331" y="152" width="16" height="6" rx="2" transform="rotate(45 352 155)"/>
          <rect x="357" y="152" width="16" height="6" rx="2" transform="rotate(45 352 155)"/>
        </g>
        <circle cx="352" cy="155" r="6" fill="var(--reel)"/>
      </g>
      <!-- bottom trapezoid -->
      <path d="M110 326 L130 268 H390 L410 326" fill="var(--shell-dark)" opacity=".35"/>
    </svg>
    <div class="title" id="title" contenteditable="true" spellcheck="false" aria-label="Tên mixtape (sửa được)">My Mixtape</div>
    <div class="now"><span class="track" id="track">dán link YouTube để bắt đầu ♪</span><span class="time" id="time">0:00 / 0:00</span></div>
    <div class="progress" id="progress" role="slider" aria-label="Tiến độ"><div class="bar"><div class="fill" id="fill"></div></div></div>
  </div>

  <div class="deck">
    <button class="btn" id="prev" aria-label="Bài trước"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="btn play" id="play" aria-label="Phát / Tạm dừng">
      <svg viewBox="0 0 24 24" id="icoPlay"><path d="M7 4v16l13-8z"/></svg>
      <svg viewBox="0 0 24 24" id="icoPause" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button class="btn" id="next" aria-label="Bài sau"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <input class="vol" id="vol" type="range" min="0" max="100" value="80" aria-label="Âm lượng">
    <button class="btn small" id="loop" aria-label="Lặp lại" title="Lặp lại"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
    <button class="btn small" id="vid" aria-label="Hiện video" title="Hiện / ẩn video"><svg viewBox="0 0 24 24"><path d="M3 5h14v14H3zM17 10l4-3v10l-4-3z"/></svg></button>
  </div>

  <form class="loader" id="loader">
    <input id="link" type="text" placeholder="dán link YouTube (video hoặc playlist)" autocomplete="off">
    <button type="submit">TẢI</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="yt" id="ytBox"><div id="yt"></div></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const store = {
    get(k) { try { return localStorage.getItem("cassette:" + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("cassette:" + k, v); } catch {} },
  };

  // ---- options: ?theme=autumn|mint|night  ?title=...  ?url=<youtube link>  ?ui=0 (hide link box)
  const theme = (qs.get("theme") || "").toLowerCase().replace(/^autum$/, "autumn");
  if (theme) document.documentElement.dataset.theme = theme;
  if (qs.get("ui") === "0") $("wrap").classList.add("hide-ui");
  $("title").textContent = qs.get("title") || store.get("title") || "My Mixtape";
  $("title").addEventListener("input", () => store.set("title", $("title").textContent.trim()));
  $("title").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });

  const msg = (t, err) => { $("msg").textContent = t || ""; $("msg").classList.toggle("err", !!err); };

  // ---- parse any YouTube link form: watch, youtu.be, shorts, embed, live, music.youtube, playlist, bare IDs
  function parse(raw) {
    raw = (raw || "").trim();
    if (!raw) return null;
    if (/^[\w-]{11}$/.test(raw)) return { video: raw };
    if (/^(PL|OL|UU|FL|RD|LL)[\w-]{10,}$/.test(raw)) return { list: raw };
    let u;
    try { u = new URL(/^https?:\/\//.test(raw) ? raw : "https://" + raw); } catch { return null; }
    if (!/(^|\.)youtube\.com$|(^|\.)youtu\.be$|(^|\.)youtube-nocookie\.com$/.test(u.hostname)) return null;
    let video = u.searchParams.get("v");
    const list = u.searchParams.get("list");
    const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/) || (u.hostname.endsWith("youtu.be") && u.pathname.match(/^\/([\w-]{11})/));
    if (m) video = m[1];
    const t = u.searchParams.get("t") || u.searchParams.get("start");
    const start = t ? (+t.replace(/s$/, "") || (t.match(/(\d+)m/)?.[1] * 60 || 0) + (+t.match(/(\d+)s/)?.[1] || 0)) : 0;
    const index = Math.max(0, (+u.searchParams.get("index") || 1) - 1);
    if (!video && !list) return null;
    return { video, list, start, index };
  }

  // ---- YouTube IFrame API
  let player, ready = false, pending = null, isList = false, loop = false, errSkips = 0;
  // A link with both v= and list= (e.g. a YouTube Mix "RD…") plays that exact video first,
  // then hands over to the list, continuing right after the seed video.
  let queue = null, seekAfter = null;
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = () => {
    const vars = { playsinline: 1, controls: 1, rel: 0, modestbranding: 1, iv_load_policy: 3 };
    if (location.protocol.startsWith("http")) { vars.origin = location.origin; vars.widget_referrer = location.href; }
    player = new YT.Player("yt", {
      width: "100%", height: "100%", playerVars: vars,
      events: {
        onReady: () => {
          ready = true;
          player.setVolume(+$("vol").value);
          if (pending) { load(pending, false); pending = null; }
        },
        onStateChange: e => {
          const playing = e.data === YT.PlayerState.PLAYING;
          $("cassette").classList.toggle("playing", playing);
          $("icoPlay").style.display = playing ? "none" : "";
          $("icoPause").style.display = playing ? "" : "none";
          if (playing) { errSkips = 0; msg(""); updateTitle(); }
          if (seekAfter) {                      // first callback after handing over to the list
            const pl = player.getPlaylist && player.getPlaylist();
            if (pl && pl.length) {
              const i = pl.indexOf(seekAfter); seekAfter = null;
              if (i >= 0 && i + 1 < pl.length && player.getPlaylistIndex() !== i + 1) player.playVideoAt(i + 1);
            }
          }
          if (e.data === YT.PlayerState.ENDED && !handover() && loop && !isList) { player.seekTo(0); player.playVideo(); }
          if (e.data === YT.PlayerState.CUED) updateTitle();
        },
        onError: e => {
          console.warn("YT error", e.data);
          const why = { 2: "link/ID không hợp lệ", 5: "trình duyệt không phát được video này",
            100: "video đã bị xoá hoặc để riêng tư", 101: "chủ video không cho phép phát nhúng", 150: "chủ video không cho phép phát nhúng" }[e.data] || "lỗi " + e.data;
          if (queue) { msg(`Bỏ qua bài đầu: ${why}. Chuyển sang playlist…`, true); setTimeout(handover, 900); return; }
          if (isList && errSkips < 10) {
            errSkips++; msg(`Bỏ qua 1 bài: ${why}. Đang chuyển bài…`, true);
            setTimeout(() => player.nextVideo(), 900);
          } else {
            msg(`Không phát được: ${why}. Thử link khác nhé.`, true);
            $("track").textContent = "không phát được video này";
          }
        },
      },
    });
  };

  function load(src, autoplay) {
    if (!ready) { pending = src; return; }
    queue = null; seekAfter = null;
    if (src.list && src.video) {
      isList = false;
      queue = { list: src.list, seed: src.video };
      const opts = { videoId: src.video, startSeconds: src.start || 0 };
      autoplay ? player.loadVideoById(opts) : player.cueVideoById(opts);
      $("track").textContent = "đang tải…";
      return;
    }
    isList = !!src.list;
    if (src.list) {
      const opts = { listType: "playlist", list: src.list, index: src.index || 0, startSeconds: src.start || 0 };
      autoplay ? player.loadPlaylist(opts) : player.cuePlaylist(opts);
      if (loop) player.setLoop(true);
    } else {
      const opts = { videoId: src.video, startSeconds: src.start || 0 };
      autoplay ? player.loadVideoById(opts) : player.cueVideoById(opts);
    }
    $("track").textContent = "đang tải…";
  }

  function handover() {
    const q = queue; queue = null;
    if (!q) return false;
    isList = true; seekAfter = q.seed;
    player.loadPlaylist({ listType: "playlist", list: q.list, index: 0 });
    if (loop) player.setLoop(true);
    return true;
  }

  function updateTitle() {
    const d = player && player.getVideoData && player.getVideoData();
    if (d && d.title) $("track").textContent = d.title + (d.author ? " — " + d.author : "");
  }

  $("loader").addEventListener("submit", e => {
    e.preventDefault();
    const src = parse($("link").value);
    if (!src) { msg("Link không đúng. Dán link YouTube dạng youtube.com/watch?v=… hoặc youtu.be/… hoặc playlist.", true); return; }
    store.set("link", $("link").value.trim());
    msg(src.list ? "Đã nạp playlist ♪" : "Đã nạp bài ♪");
    load(src, true);                 // the submit click counts as a user gesture, so playback may start
  });

  // ---- controls
  $("play").onclick = () => {
    if (!ready) return msg("Đang khởi động trình phát…");
    const st = player.getPlayerState();
    if (st === YT.PlayerState.PLAYING) player.pauseVideo();
    else if (st === -1 && !player.getVideoUrl().includes("v=")) msg("Dán link YouTube rồi bấm TẢI trước nhé.", true);
    else player.playVideo();
  };
  $("next").onclick = () => { if (!ready || handover()) return; isList ? player.nextVideo() : player.seekTo(Math.max(0, player.getDuration() - 1), true); };
  $("prev").onclick = () => { if (!ready) return; (isList && player.getCurrentTime() < 3) ? player.previousVideo() : player.seekTo(0, true); };
  $("vol").oninput = e => { if (ready) { player.setVolume(+e.target.value); player.unMute(); } store.set("vol", e.target.value); };
  $("loop").onclick = () => { loop = !loop; $("loop").classList.toggle("on", loop); if (ready && isList) player.setLoop(loop); };
  $("vid").onclick = () => { const on = $("wrap").classList.toggle("show-video"); $("vid").classList.toggle("on", on); };
  $("progress").onclick = e => {
    if (!ready || !player.getDuration) return;
    const r = e.currentTarget.getBoundingClientRect();
    player.seekTo(player.getDuration() * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), true);
  };
  const v = store.get("vol"); if (v) $("vol").value = v;

  // ---- progress, clock and tape packs
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  setInterval(() => {
    if (!ready || !player.getDuration) return;
    const live = player.getVideoData && player.getVideoData().isLive;
    const d = player.getDuration() || 0, t = player.getCurrentTime() || 0, p = d && !live ? t / d : 0;
    $("fill").style.width = (p * 100).toFixed(2) + "%";
    $("time").textContent = live ? "● LIVE" : `${fmt(t)} / ${fmt(d)}`;
    $("packL").setAttribute("r", (44 - 22 * p).toFixed(1));
    $("packR").setAttribute("r", (22 + 22 * p).toFixed(1));
  }, 250);

  // ---- initial source: ?url=… or last used link
  const initial = qs.get("url") || qs.get("v") || qs.get("list") || store.get("link");
  if (initial) { $("link").value = initial; const src = parse(initial); if (src) load(src, false); }
})();
</script>
</body>
</html>
